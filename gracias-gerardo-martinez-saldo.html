<title>Tu pago final — Easy Camino Santiago</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --azul:#56A1A4; --azul-dark:#2D4A52; --naranja:#F3A949; }
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Lato',sans-serif; background:#f5fafa; color:var(--azul-dark); display:flex; flex-direction:column; min-height:100vh; }
  .nav { background:white; border-bottom:1px solid #e0eeec; padding:16px 40px; }
  .nav img { height:44px; width:auto; }
  .main { flex:1; display:flex; align-items:center; justify-content:center; padding:60px 24px; }
  .card { background:white; border-radius:20px; box-shadow:0 8px 40px rgba(86,161,164,0.12); padding:60px 48px; text-align:center; max-width:480px; width:100%; }
  .icon { font-size:3.5rem; margin-bottom:24px; }
  h1 { font-family:'Raleway',sans-serif; font-size:2rem; font-weight:900; color:var(--azul-dark); margin-bottom:12px; }
  p { color:#5a6b6a; line-height:1.7; margin-bottom:24px; }
  .tel { display:block; font-size:1.3rem; font-weight:700; color:var(--azul); text-decoration:none; margin-bottom:8px; }
  .back { display:inline-block; background:var(--naranja); color:white; padding:14px 32px; border-radius:30px; font-family:'Raleway',sans-serif; font-weight:700; text-decoration:none; font-size:0.95rem; margin-top:8px; }
  .back:hover { filter:brightness(0.9); }
  .spinner { width:44px; height:44px; border:4px solid #d8e8e8; border-top-color:var(--azul); border-radius:50%; margin:0 auto 24px; animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html"><img src="easy-camino-santiago-logo.png" alt="Easy Camino Santiago"></a>
</nav>
<div class="main">
  <div class="card" id="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Comprobando tu pago…</h1>
    <p>Estamos verificando con nuestro sistema de pagos que todo se ha completado correctamente. Esto solo tarda unos segundos.</p>
  </div>
</div>
<script type="text/javascript" id="hs-script-loader" async defer src="//js-eu1.hs-scripts.com/148622668.js"></script>
<script>
// La confirmación NUNCA se da por el simple hecho de abrir esta URL: se
// consulta siempre al servidor (verify-final-payment.js), que a su vez solo
// confía en lo que stripe-webhook.js marcó tras verificar la firma de Stripe
// en un evento payment_intent.succeeded real. No se usa ninguna clave privada
// de Stripe en esta página — solo un endpoint propio de solo lectura.
const REFERENCIA = 'ECS-SARRIA-GM2026';
const MAX_INTENTOS = 6;     // ~18 s en total — cubre la latencia normal del webhook
const ESPERA_MS   = 3000;

function mostrarConfirmado() {
  document.getElementById('card').innerHTML = `
    <div class="icon">✅</div>
    <h1>¡Reserva completamente abonada!</h1>
    <p>Pago recibido correctamente. Gracias, Gerardo. Hemos recibido tu saldo final de <strong>488 €</strong> — tu Camino Francés desde Sarria queda totalmente pagado.</p>
    <p>Te escribiremos al email que nos indicaste con la documentación final de tu viaje.</p>
    <p>Si prefieres hablar ahora:</p>
    <a href="tel:+34982907629" class="tel">📞 +34 982 907 629</a>
    <p style="font-size:0.85rem;">Lun–Vie 9:00–19:00</p>
    <a href="index.html" class="back">← Volver al inicio</a>
  `;
}

function mostrarPendiente() {
  document.getElementById('card').innerHTML = `
    <div class="icon">⏳</div>
    <h1>Aún no podemos confirmar tu pago</h1>
    <p>No hemos podido verificar en este momento el estado de tu pago. Si acabas de completarlo, recibirás la confirmación por email en breve — no hace falta que vuelvas a intentarlo desde aquí.</p>
    <p>Si tienes cualquier duda sobre tu reserva, contáctanos:</p>
    <a href="tel:+34982907629" class="tel">📞 +34 982 907 629</a>
    <p style="font-size:0.85rem;">Lun–Vie 9:00–19:00</p>
    <a href="index.html" class="back">← Volver al inicio</a>
  `;
}

async function verificarPago() {
  for (let intento = 0; intento < MAX_INTENTOS; intento++) {
    try {
      const res = await fetch('/.netlify/functions/verify-final-payment?reserva_id=' + encodeURIComponent(REFERENCIA));
      const data = await res.json();
      if (data && data.paid === true) {
        mostrarConfirmado();
        return;
      }
    } catch (e) {
      console.warn('[gracias-gerardo-martinez-saldo] error al verificar el pago, se reintenta:', e.message);
    }
    if (intento < MAX_INTENTOS - 1) {
      await new Promise(r => setTimeout(r, ESPERA_MS));
    }
  }
  mostrarPendiente();
}

verificarPago();
</script>
</body>
</html>
